# Schedules are in TOKENS, not steps (DESIGN 6.6).
optimizer: adamw            # adamw | adamw8bit  (8bit must be A/B-verified first)
lr: 1.0e-3
min_lr_ratio: 0.1           # cosine floor as a fraction of lr
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
warmup_tokens: 1_000_000
batch_size: 64
grad_accum: 1
compile: true
compile_mode: default       # use reduce-overhead at nano/micro: partly launch-bound
eval_every_steps: 250
eval_samples: 8             # generated samples printed at every eval -- do not set to 0
ckpt_every_minutes: 20      # time-based: the machine gets powered off mid-run
keep_last_n_ckpts: 3
max_consecutive_skips: 20   # abort after this many non-finite steps
