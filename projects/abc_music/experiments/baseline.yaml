# First ABC run: the smallest preset, character tokenizer, all augmentation on.
# Proves the pipeline before spending GPU time (CONTRIBUTING.md: new projects start at nano).
run:
  name: abc-baseline
  seed: 1337
  tracker: tensorboard
project:
  name: abc_music
  args:
    transpose_semitones: [-2, -1, 1, 2]
    max_key_accidentals: 3
    header_dropout: 0.4
tokenizer:
  type: char
data:
  block_size: 512           # most tunes fit in one window (median ~380 characters)
  val_fraction: 0.1
  append_eos: true          # tunes are independent documents: the model must learn to end one
model:
  preset: nano
  overrides: {dropout: 0.1}
train:
  preset: default
  max_tokens: 30_000_000    # ~10 passes over 2.85M augmented train tokens (~30 over the originals)
  batch_size: 64
  lr: 1.0e-3
  warmup_tokens: 1_000_000
  eval_every_steps: 250
  eval_iters: 50
  eval_samples: 2
  sample_tokens: 400
eval:
  num_samples: 200
  seeds: [0, 1, 2]
  temperature: 0.8
