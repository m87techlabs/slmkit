# The augmentation A/B: identical to baseline.yaml except no transposition, so the model sees only
# the 3,829 original training tunes (~0.97M characters) instead of 11,316 (~2.85M). Header dropout
# stays: it changes how tunes are presented, not how many there are. Same 30M-token budget, so
# ~30 passes over the data instead of ~10: this measures what transposition buys at equal compute.
# No SFT: this sweep compares pretraining.
run:
  name: abc-noaug
  seed: 1337
  tracker: tensorboard
project:
  name: abc_music
  args:
    transpose_semitones: []
    max_key_accidentals: 3
    header_dropout: 0.4
tokenizer:
  type: char
data:
  block_size: 512
  val_fraction: 0.1
  append_eos: true
model:
  preset: nano
  overrides: {dropout: 0.1}
train:
  preset: default
  max_tokens: 30_000_000
  batch_size: 64
  lr: 1.0e-3
  warmup_tokens: 1_000_000
  eval_every_steps: 250
  eval_iters: 50
  eval_samples: 2
  sample_tokens: 400
eval:
  num_samples: 200
  seeds: [0, 1, 2]
  temperature: 0.8
