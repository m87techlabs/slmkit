[project]
name = "slmkit"
version = "0.1.0"
description = "A framework for building small, task-specific language models from scratch on one consumer GPU."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["llm", "language-model", "pretraining", "transformer", "machine-learning"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy>=2.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "tensorboard>=2.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# One extra per project, so the base install stays light and `make test` stays fast.
abc_music = ["music21>=9.1"]
chess     = ["python-chess>=1.10"]
export    = ["transformers>=4.44"]   # HF export parity tests only
wandb     = ["wandb>=0.17"]
optim8bit = ["bitsandbytes>=0.45.3"]   # 8-bit Adam; verified on sm_120, see ADR 0001
dev       = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
slm = "slmkit.cli:app"

# Blackwell (sm_120) needs a CUDA 12.8+ wheel. Encoded here so it cannot be
# forgotten at install time -- see docs/DESIGN.md section 3.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slmkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Ruff formats Python code blocks inside Markdown by default. The ones in docs/
# are illustrative sketches with hand-aligned comments, not code, so leave them.
[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/slmkit"]

# Optional, untyped third-party optimizer. Kept out of strict checking rather
# than dropped, because it is exercised by `slm doctor` on real hardware.
[[tool.mypy.overrides]]
module = ["bitsandbytes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA device (deselect with -m 'not gpu')"]
testpaths = ["tests", "projects"]
